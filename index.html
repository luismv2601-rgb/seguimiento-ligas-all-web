<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%231b4332%22/><path d=%22M50 24 L72 40 L64 66 L36 66 L28 40 Z%22 fill=%22%23ffffff%22/><path d=%22M50 4 L50 24 M96 44 L72 40 M78 88 L64 66 M22 88 L36 66 M4 44 L28 40%22 stroke=%22%23ffffff%22 stroke-width=%228%22 fill=%22none%22/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23ffffff%22/><circle cx=%2250%22 cy=%2250%22 r=%2234%22 fill=%22%231b4332%22/><path d=%22M50 31 L66 43 L60 62 L40 62 L34 43 Z%22 fill=%22%23ffffff%22/><path d=%22M50 16 L50 31 M84 46 L66 43 M70 78 L60 62 M30 78 L40 62 M16 46 L34 43%22 stroke=%22%23ffffff%22 stroke-width=%226%22 fill=%22none%22/></svg>">
<title>Seguimiento Ligas All</title>
<script>
  // Se aplica antes de pintar para que el tema oscuro no arranque con un flash claro.
  document.documentElement.setAttribute("data-tema", localStorage.getItem("tema") || "claro");
</script>
<style>
  :root {
    /* Tema claro: el predeterminado */
    --bg: #f4f5f8;
    --superficie: #ffffff;
    --superficie-2: #eceef3;
    --borde: #dde1e9;
    --borde-suave: #e9ecf2;
    --texto: #23262e;
    --texto-fuerte: #0f1115;
    --texto-suave: #5a606c;
    --texto-tenue: #838996;
    --chevron: #b4bac5;
    --gris: #c2c7d0;
    --sombra: rgba(0,0,0,0.14);
  }
  :root[data-tema="oscuro"] {
    --bg: #0f1115;
    --superficie: #1a1d24;
    --superficie-2: #22252c;
    --borde: #2a2d35;
    --borde-suave: #22252c;
    --texto: #e8e8ea;
    --texto-fuerte: #ffffff;
    --texto-suave: #9a9ea8;
    --texto-tenue: #7d8290;
    --chevron: #4a4d55;
    --gris: #3a3d45;
    --sombra: rgba(0,0,0,0.45);
  }

  .tema-btn {
    position: fixed;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 0;
    border: 1px solid var(--borde);
    background: var(--superficie);
    color: var(--texto-suave);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    z-index: 20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--texto);
    padding-bottom: 70px;
  }
  /* Franja azul marino: mismo color en los dos temas, el titulo siempre va en blanco. */
  .header {
    background: #0b2545;
    padding: 14px 16px 10px 16px;
    margin-bottom: 14px;
  }
  h1 { font-size: 19px; margin: 0; text-align: center; color: #fff; }
  .logo { width: 21px; height: 21px; vertical-align: -3px; }
  .header-sub { text-align: center; font-size: 11px; color: rgba(255,255,255,.7); margin-top: 4px; }
  .section-heading { font-size: 15px; font-weight: 700; color: var(--texto-fuerte); margin: 4px 0 12px 0; }

  .page { display: none; padding: 0 16px; }
  .page.active { display: block; }

  .buscador {
    width: 100%;
    padding: 14px 16px;
    border-radius: 0;
    border: 1px solid var(--borde);
    background: var(--superficie);
    color: var(--texto);
    font-size: 15px;
    margin-bottom: 14px;
  }
  .buscador::placeholder { color: var(--texto-tenue); }

  .fila-liga {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 0;
    padding: 9px 12px;
    margin-bottom: 5px;
    cursor: pointer;
  }
  .fila-liga:active { background: var(--superficie-2); }
  .fila-liga-izq { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 0; }
  .fila-liga-izq > div { min-width: 0; }
  .fila-liga-nombre {
    font-size: 13.5px; font-weight: 600; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fila-liga-pais {
    font-size: 11px; color: var(--texto-tenue); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fila-liga-serie { color: var(--texto-suave); font-weight: 600; }
  /* La columna se estira a lo alto de la fila. Dentro, la racha va arriba (a la
     altura del nombre) con la cuenta debajo, y el semaforo y el chevron quedan
     centrados. Solo se toca el eje vertical. */
  .fila-liga-derecha { display: flex; align-items: center; align-self: stretch; gap: 8px; }
  /* Sin cuenta va centrada; con cuenta sube para que la racha quede a la altura
     del nombre y la cuenta a la del pais. */
  .racha-col {
    display: flex; flex-direction: column; align-items: center;
    gap: 1px; min-width: 54px; align-self: center;
  }
  .racha-col-arriba { align-self: flex-start; }
  .chevron { align-self: center; }
  .semaforo { width: 11px; height: 11px; border-radius: 0; flex-shrink: 0; }

  .pais-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 21px;
    padding: 0 5px;
    border-radius: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    flex-shrink: 0;
  }
  .pais-pill-grande { min-width: 42px; height: 30px; font-size: 15px; border-radius: 0; }

  .pais-flag {
    width: 26px;
    height: 17.5px;
    border-radius: 3.5px;
    flex-shrink: 0;
    display: block;
    /* Borde interno: sin el, las banderas con blanco al borde (Polonia, Chequia)
       se funden con el fondo en tema claro. */
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.35);
  }
  .pais-flag-grande { width: 42px; height: 28px; border-radius: 5px; }

  /* --- Agrupacion por continente --- */
  .alerta-titulo {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; color: #9d2929;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 2px 2px 8px 2px;
  }
  .sin-alertas {
    font-size: 12px; color: var(--texto-tenue);
    margin: 2px 2px 16px 2px;
  }
  .alerta-bloque { margin-bottom: 18px; }
  /* La cuenta va bajo el semaforo, en el espacio vertical que la columna derecha
     ya tenia libre: la fila no crece de alto. */
  .cuenta { font-size: 10px; font-weight: 700; color: #9d2929; line-height: 1; white-space: nowrap; }
  .cuenta-vacia { color: var(--texto-tenue); font-weight: 400; }

  .grupo-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; margin-bottom: 5px;
    background: var(--superficie-2);
    border: 1px solid var(--borde);
    border-radius: 0;
    cursor: pointer;
    user-select: none;
  }
  .grupo-nombre { font-size: 13px; font-weight: 700; color: var(--texto); }
  .grupo-meta { font-size: 11px; color: var(--texto-tenue); display: flex; align-items: center; gap: 7px; }
  .grupo-flecha { font-size: 11px; display: inline-block; transition: transform 0.15s; }
  .grupo.cerrado .grupo-flecha { transform: rotate(-90deg); }
  .grupo.cerrado .grupo-contenido { display: none; }
  .grupo { margin-bottom: 10px; }
  .semaforo-verde { background: #2d6a4f; box-shadow: 0 0 8px #2d6a4f; }
  .semaforo-amarillo { background: #a67c00; box-shadow: 0 0 8px #a67c00; }
  .semaforo-rojo { background: #9d2929; box-shadow: 0 0 8px #9d2929; }
  .semaforo-gris { background: var(--gris); }
  /* Mismo line-height que el nombre para que las dos lineas de texto calcen. */
  .fila-liga-racha { font-size: 13px; font-weight: 700; min-width: 54px; text-align: center; line-height: 1.25; }
  .fila-liga-sindatos { font-size: 12px; color: var(--texto-tenue); }
  .chevron { color: var(--chevron); font-size: 16px; }

  /* Va en la misma fila que la bandera, empujado a la derecha por el titulo. */
  .volver-btn {
    background: none;
    border: none;
    color: var(--texto-suave);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .detalle-liga-header { display: flex; align-items: center; gap: 10px; padding-top: 8px; margin-bottom: 14px; }
  .detalle-liga-titulo { min-width: 0; flex: 1; }
  .detalle-liga-nombre, .detalle-liga-pais { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detalle-liga-bandera { display: flex; flex-shrink: 0; }
  .detalle-liga-nombre { font-size: 18px; font-weight: 700; color: var(--texto-fuerte); }
  .detalle-liga-pais { font-size: 12px; color: var(--texto-tenue); }

  .subtabs {
    display: flex;
    background: var(--superficie-2);
    border-radius: 0;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .subtab-btn {
    flex: 1;
    padding: 12px 4px;
    text-align: center;
    background: none;
    border: none;
    color: var(--texto-suave);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .subtab-btn.active { background: #2d6a4f; color: #fff; }
  .subpage { display: none; }
  .subpage.active { display: block; }

  .card { border-radius: 0; padding: 20px; margin-bottom: 16px; text-align: center; }
  .card-green { background: linear-gradient(135deg, #1b4332, #2d6a4f); }
  .card-yellow { background: linear-gradient(135deg, #7f5c00, #a67c00); }
  .card-red { background: linear-gradient(135deg, #6a1b1b, #9d2929); }
  .card-gray { background: var(--superficie); border: 1px solid var(--borde); }

  .racha-numero { font-size: 44px; font-weight: 700; color: #fff; line-height: 1; }
  .racha-label { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 4px; }

  .ficha-analisis {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 0;
    overflow: hidden;
  }
  .ficha-fila {
    display: flex;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--borde-suave);
    font-size: 13px;
  }
  .ficha-fila:last-child { border-bottom: none; }
  .ficha-etiqueta { color: var(--texto-suave); }
  .ficha-valor { color: var(--texto-fuerte); font-weight: 600; }

  .section-title {
    font-size: 14px;
    color: var(--texto-suave);
    margin: 20px 0 10px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .orden-nota {
    font-size: 12px;
    color: var(--texto-tenue);
    margin: 2px 2px 10px 2px;
  }

  /* --- Escala "qué tan rara es esta racha" --- */
  .extremo-pregunta { font-size: 14px; color: var(--texto-suave); margin: 16px 2px 14px 2px; text-align: center; }

  /* Tres bandas apiladas: las referencias fijas (umbral, doble, récord) arriba de
     la barra, la barra en el medio, y la racha de ahora abajo. Cada etiqueta se
     posiciona con left:% sobre el mismo eje que usa la barra, asi cae justo encima
     del valor que nombra. */
  .escala-wrap { position: relative; margin: 0 2px; }
  .escala-marcas, .escala-abajo { position: relative; height: 36px; }
  .escala-marcas .marca { position: absolute; bottom: 2px; }
  .escala-abajo .marca { position: absolute; top: 2px; }

  .marca { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
  .marca-txt { font-size: 12px; opacity: 0.8; }
  .marca-num { font-size: 17px; font-weight: 700; }

  .escala { position: relative; height: 14px; }
  .escala-track {
    position: absolute; inset: 0;
    background: var(--superficie-2); border-radius: 0; overflow: hidden;
  }
  .escala-relleno { height: 100%; border-radius: 0; background: var(--texto-suave); }
  .escala-tick {
    position: absolute; top: -4px; width: 2px; height: 22px;
    background: var(--texto-tenue); transform: translateX(-1px);
  }

  /* Marcador de la racha de ahora: atraviesa la barra entera y sobresale para
     abajo, donde esta su etiqueta. Va en un color propio y no en el de las marcas
     fijas justamente para que se lea como "el dato" y no como otra referencia. */
  .escala-ahora {
    position: absolute; top: -6px; width: 3px; height: 30px;
    background: #0d1b2a; transform: translateX(-1.5px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.85);
  }

  .escala-frase { font-size: 13px; color: var(--texto); margin: 10px 2px 18px 2px; text-align: center; }

  /* La misma escala, pero dentro del cuadro de color del detalle de liga. Ahi el
     fondo ya es verde/amarillo/rojo, asi que los colores del tema no se leen: todo
     pasa a blanco con transparencias. El relleno va blanco solido porque el
     degradado original es del mismo color que el cuadro y quedaria invisible. */
  .card-extremos { text-align: left; color: #fff; }
  .card-extremos .extremo-pregunta { color: rgba(255,255,255,0.85); margin: 0 0 10px 0; }
  .card-extremos .escala-wrap { margin: 0; }
  .card-extremos .escala-track { background: rgba(255,255,255,0.22); }
  .card-extremos .escala-relleno { background: rgba(255,255,255,0.92); }
  /* Oscuros y no blancos: sobre el tramo ya relleno de blanco, un tick blanco
     desaparece. */
  .card-extremos .escala-tick { background: rgba(0,0,0,0.32); }
  .card-extremos .escala-frase { color: rgba(255,255,255,0.92); margin: 8px 0 0 0; }

  .extremo-temp {
    background: var(--superficie); border: 1px solid var(--borde);
    border-radius: 0; padding: 12px 14px; margin-bottom: 8px;
  }
  .extremo-temp-head {
    display: flex; justify-content: space-between;
    align-items: baseline; gap: 8px; margin-bottom: 8px;
  }
  .extremo-anio { font-size: 15px; font-weight: 700; color: var(--texto-fuerte); }
  .extremo-resumen { font-size: 12px; color: var(--texto-suave); text-align: right; }
  .extremo-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 0;
    padding: 4px 9px; font-size: 13px; font-weight: 700; color: var(--texto);
  }
  .chip-max { background: #6a1b1b; border-color: #9d2929; color: #fff; }
  .extremo-vacio { font-size: 12px; color: var(--texto-tenue); }

  /* --- Sub-pestaña Próximos --- */
  .prox-dia {
    font-size: 13px; font-weight: 700; color: var(--texto);
    margin: 16px 2px 8px 2px;
  }
  .prox-cuando { font-weight: 400; color: var(--texto-tenue); font-size: 12px; }
  .prox-vs { color: var(--texto-tenue); font-weight: 600; font-size: 13px; }

  .partido {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 0;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .partido-fecha { font-size: 11px; color: var(--texto-tenue); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .partido-marcador { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .equipo { flex: 1; }
  .equipo.local { text-align: right; padding-right: 10px; }
  .equipo.visitante { text-align: left; padding-left: 10px; }
  .goles {
    font-weight: 700;
    font-size: 17px;
    background: var(--superficie-2);
    padding: 4px 10px;
    border-radius: 0;
    min-width: 50px;
    text-align: center;
  }
  .badge-fila { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .empate-badge, .modalidad-badge {
    display: inline-block;
    font-size: 10px;
    color: #fff;
    padding: 2px 8px;
    border-radius: 0;
  }
  .empate-badge { background: #7f5c00; }
  .modalidad-badge.paralelo { background: #2a4d6e; }
  .modalidad-badge.secuencial { background: var(--superficie-2); color: var(--texto-suave); }

  .loading, .empty { text-align: center; color: var(--texto-tenue); padding: 40px 0; font-size: 14px; }

  .refresh-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #2d6a4f;
    color: #fff;
    border: none;
    border-radius: 0;
    width: 52px;
    height: 52px;
    font-size: 22px;
    box-shadow: 0 4px 12px var(--sombra);
  }
</style>
</head>
<body>

<div class="header">
  <h1><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#1b4332"/><path d="M50 24 L72 40 L64 66 L36 66 L28 40 Z" fill="#ffffff"/><path d="M50 4 L50 24 M96 44 L72 40 M78 88 L64 66 M22 88 L36 66 M4 44 L28 40" stroke="#ffffff" stroke-width="8" fill="none"/></svg> Seguimiento Ligas All</h1>
  <div id="ultimaEjecucion" class="header-sub"></div>
</div>

<div class="page active" id="pageLista">
  <div class="section-heading">Detalle de las ligas</div>
  <input type="text" class="buscador" id="buscadorLigas" placeholder="Buscar liga o país...">
  <div class="orden-nota">En alerta: el que juega antes va arriba · dentro de cada continente, mayor % en serie primero</div>
  <div id="listaResumen"><div class="loading">Cargando datos...</div></div>
</div>

<div class="page" id="pageDetalleLiga">
  <div class="detalle-liga-header">
    <div class="detalle-liga-bandera" id="detalleBandera"></div>
    <div class="detalle-liga-titulo">
      <div class="detalle-liga-nombre" id="detalleNombre"></div>
      <div class="detalle-liga-pais" id="detallePais"></div>
    </div>
    <button class="volver-btn" onclick="volverALista()">← Volver</button>
  </div>

  <div id="detalleRachaCard"></div>

  <div class="subtabs">
    <button class="subtab-btn active" id="subtabBtnExtremos" onclick="cambiarSubpagina('extremos')">Extremos</button>
    <button class="subtab-btn" id="subtabBtnPartidos" onclick="cambiarSubpagina('partidos')">Partidos</button>
    <button class="subtab-btn" id="subtabBtnProximos" onclick="cambiarSubpagina('proximos')">Próximos</button>
    <button class="subtab-btn" id="subtabBtnAnalisis" onclick="cambiarSubpagina('analisis')">Análisis</button>
  </div>

  <div class="subpage active" id="subpageExtremos"></div>
  <div class="subpage" id="subpagePartidos"></div>
  <div class="subpage" id="subpageProximos"></div>
  <div class="subpage" id="subpageAnalisis"></div>
</div>

<button class="tema-btn" id="temaBtn" onclick="alternarTema()" title="Cambiar entre claro y oscuro">☾</button>
<button class="refresh-btn" onclick="cargarTodo()">↻</button>

<script>
const SHEET_ID = "1pw9zxaCFvKG3v5JlLbcIInJkuaYK2EiUIjwv8vkOFx8";
const csvUrl = (gid) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

const URL_ANALISIS  = csvUrl(17416755);
const URL_RACHA     = csvUrl(1219895524);
const URL_ESTADO    = csvUrl(874141647);
const URL_EXTREMOS  = csvUrl(615039692);   // hoja "Analisis 2", ~2 KB
const URL_PROXIMOS  = csvUrl(1027481726);  // hoja "Proximos", ~35 KB

// La hoja Partidos ya pesa mas de 1 MB y crece con cada liga, asi que no se baja
// entera: se piden solo los partidos de la liga que el usuario abre, filtrados del
// lado de Google con el lenguaje de consultas de gviz.
const GID_PARTIDOS = 0;
const gvizUrl = (gid, consulta) =>
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&tq=${encodeURIComponent(consulta)}`;

// Pastilla plana con el codigo del pais y el color dominante de su bandera.
// Reemplaza a los emoji de bandera: los dibuja el sistema operativo, salen
// "ondeados" y ocupan mas alto del que hace falta. Ademas varios Android no los
// traen y ya se veian como dos letras.
const PAISES = {
  "Inglaterra": ["EN", "#c8102e"], "España": ["ES", "#c60b1e"], "Alemania": ["DE", "#1a1a1a"],
  "Italia": ["IT", "#008c45"], "Francia": ["FR", "#0055a4"], "Países Bajos": ["NL", "#f36c21"],
  "Portugal": ["PT", "#006600"], "Bélgica": ["BE", "#fdda24"], "Turquía": ["TR", "#e30a17"],
  "Escocia": ["SC", "#005eb8"], "Grecia": ["GR", "#0d5eaf"], "Dinamarca": ["DK", "#c60c30"],

// Sobre amarillos y celestes el texto blanco no se lee: se elige segun luminancia.
function textoSobre(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum > 0.6 ? "#1a1a1a" : "#ffffff";
}

function codigoDe(pais) {
  const p = PAISES[pais];
  return p ? p[0] : (pais || "??").slice(0, 2).toUpperCase();
}

function pastillaDe(pais, clase) {
  const p = PAISES[pais];
  const fondo = p ? p[1] : "#8a8f9a";
  return `<span class="pais-pill ${clase || ""}" style="background:${fondo};color:${textoSobre(fondo)}">${codigoDe(pais)}</span>`;
}

function parseCSVLinea(linea) {
  const valores = [];
  let actual = "";
  let entreComillas = false;
  for (let i = 0; i < linea.length; i++) {
    const c = linea[i];
    if (c === '"') {
      if (entreComillas && linea[i + 1] === '"') {
        actual += '"';
        i++;
      } else {
        entreComillas = !entreComillas;
      }
    } else if (c === "," && !entreComillas) {
      valores.push(actual);
      actual = "";
    } else {
      actual += c;
    }
  }
  valores.push(actual);
  return valores.map(v => v.trim().replace(/\r/g, ""));
}

function parseCSV(texto) {
  const lineas = texto.trim().split("\n");
  const encabezados = parseCSVLinea(lineas[0]);
  return lineas.slice(1).map(linea => {
    const valores = parseCSVLinea(linea);
    const obj = {};
    encabezados.forEach((h, i) => obj[h] = valores[i]);
    return obj;
  });
}

function numeroDecimalComaOPunto(texto) {
  return parseFloat(String(texto).replace(",", "."));
}

function aplicarTema(tema) {
  document.documentElement.setAttribute("data-tema", tema);

  // El icono muestra a donde se va, no donde se esta.
  document.getElementById("temaBtn").textContent = tema === "oscuro" ? "☀" : "☾";
}

// La hoja "Analisis 2" arranca con dos filas de titulo antes de los encabezados.
function parseCSVDesde(texto, filasAOmitir) {
  return parseCSV(texto.trim().split("\n").slice(filasAOmitir).join("\n"));
}

// Las celdas de temporada de "Analisis 2" vienen como texto legible, del estilo
// "6 de 81 (7,4%) -> 20, 13, 12". El formato lo genera analisis_extremos.py: si
// cambia alla, hay que cambiar esta expresion.
const RE_CELDA_EXTREMO = /^(\d+)\s+de\s+(\d+)\s+\(([\d.,]+)%\)(?:\s*->\s*(.*))?$/;

function parseCeldaExtremo(texto) {
  const m = RE_CELDA_EXTREMO.exec(String(texto || "").trim());
  if (!m) return null;
  return {
    cantidad: parseInt(m[1]),
    empates: parseInt(m[2]),
    pct: m[3],
    valores: m[4]
      ? m[4].split(",").map(v => parseInt(v.trim())).filter(n => !isNaN(n))
      : [],
  };
}

async function cargarTodo() {
  document.getElementById("listaResumen").innerHTML = '<div class="loading">Cargando datos...</div>';
  try {
    const t = Date.now();
    cachePartidos = {}; // el boton de refrescar tiene que traer partidos frescos
    const [ra, rr, re, rx, rp] = await Promise.all([
      fetch(URL_ANALISIS + "&t=" + t),
      fetch(URL_RACHA + "&t=" + t),
      fetch(URL_ESTADO + "&t=" + t),
      fetch(URL_EXTREMOS + "&t=" + t),
      fetch(URL_PROXIMOS + "&t=" + t),
    ]);
    datosAnalisis = parseCSV(await ra.text());
    datosExtremos = parseCSVDesde(await rx.text(), 2);
    datosProximos = parseCSVDesde(await rp.text(), 1); // una fila de titulo
    datosRacha = parseCSV(await rr.text());
    const datosEstado = parseCSV(await re.text());

    // El orden tiene dos niveles. Primero el semaforo: lo que ya esta en alerta
    // arriba. Dentro de cada color manda el % de partidos en serie, porque en una
    // liga secuencial la racha es un dato limpio, mientras que en una que juega en
    // paralelo el orden entre partidos simultaneos es arbitrario y la racha puede
    // variar en +-1. Para encontrar una liga puntual esta el buscador.
    ligas = datosRacha
      .map(r => {
        const racha = parseInt(r.racha_actual || "0");
        const umbral = parseInt(r.umbral_alerta || "5") || 5;
        const analisis = datosAnalisis.find(a => a.liga_id === r.liga_id);
        const pctTexto = analisis ? analisis.pct_secuenciales : "";
        const pct = numeroDecimalComaOPunto(pctTexto);
        return {
          id: r.liga_id,
          nombre: r.liga,
          pais: r.pais,
          region: (r.region || "").trim() || "Otras",
          racha,
          umbral,
          pctTexto,
          pctSecuenciales: isNaN(pct) ? -1 : pct,
          rango: racha >= umbral ? 0 : racha >= Math.ceil(umbral / 2) ? 1 : 2,
          proximidad: racha / umbral, // >= 1 significa que ya cruzo el umbral
        };
      })
      .sort((a, b) =>
        a.rango - b.rango ||
        b.pctSecuenciales - a.pctSecuenciales ||
        b.proximidad - a.proximidad ||
        a.pais.localeCompare(b.pais)
      );

    const filaEjecucion = datosEstado.filter(r => r.clave === "ultima_ejecucion").pop();
    document.getElementById("ultimaEjecucion").textContent = filaEjecucion
      ? `Última actualización del sistema: ${filaEjecucion.valor} (hora Perú)`
      : "";

    renderLista(ligas);

    if (ligaActualId) mostrarDetalleLiga(ligaActualId);
  } catch (err) {
    document.getElementById("listaResumen").innerHTML = '<div class="empty">Error al cargar los datos. Intenta de nuevo.</div>';
    console.error(err);
  }
}

function colorSemaforo(racha, umbral) {
  if (racha === null) return "semaforo-gris";
  if (racha >= umbral) return "semaforo-rojo";
  if (racha >= Math.ceil(umbral / 2)) return "semaforo-amarillo";
  return "semaforo-verde";
}

function escaparAtributo(texto) {
  return String(texto).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

function slug(texto) {
  return String(texto).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]/g, "");
}

// Recibe el id ya normalizado, no el nombre del continente: pasar "Sudamérica"

  const region = el.dataset.region;
  const cerrado = el.classList.toggle("cerrado");
  const abiertos = leerGruposAbiertos();
  if (cerrado) abiertos.delete(region); else abiertos.add(region);
  try { localStorage.setItem("gruposAbiertos", JSON.stringify([...abiertos])); } catch (e) { /* modo privado */ }
}

// El Sheet guarda fecha y hora en hora Peru (UTC-5). Se arma el instante absoluto
// con ese offset explicito y no con la zona del telefono, asi la cuenta da bien
// aunque el usuario este viajando.
function instanteDePartido(fecha, hora) {
  const f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(fecha || "").trim());
  const h = /^(\d{1,2}):(\d{2})$/.exec(String(hora || "").trim());
  if (!f || !h) return null;
  return Date.UTC(+f[1], +f[2] - 1, +f[3], +h[1] + 5, +h[2]);
}

function proximoPartidoDe(ligaId) {
  const ahora = Date.now();
  let mejor = null;
  datosProximos.forEach(p => {
    if (p.liga_id !== ligaId) return;
    const t = instanteDePartido(p.fecha, p.hora_peru);
    if (t === null || t < ahora) return;
    if (mejor === null || t < mejor.t) mejor = { t, p };
  });
  return mejor;
}

// Texto corto a proposito: va debajo del semaforo, en una columna angosta.
function textoFalta(ms) {
  if (ms <= 0) return "ahora";
  const min = Math.floor(ms / 60000);
  const dias = Math.floor(min / 1440);
  const horas = Math.floor((min % 1440) / 60);
  const mins = min % 60;
  if (dias > 0) return `${dias}d ${horas}h`;
  if (horas > 0) return `${horas}h ${mins}m`;
  return `${mins}m`;
}

function cuentaRegresivaHTML(ligaId) {
  const prox = proximoPartidoDe(ligaId);
  if (!prox) return '<span class="cuenta cuenta-vacia">sin fecha</span>';
  return `<span class="cuenta" data-t="${prox.t}">${textoFalta(prox.t - Date.now())}</span>`;
}

// Un solo temporizador para todas las cuentas visibles.
function refrescarCuentas() {

// Orden del bloque "En alerta", y solo de ese bloque: manda cual juega antes.
// Es la unica lista donde lo que se mira es "a que le presto atencion ahora", y
// una racha viva que juega en 2 horas pesa mas que una que juega el sabado. El
// % en serie desempata. Las que no tienen partido programado van al final.
// Dentro de los continentes se mantiene el orden por % en serie.
function porProximoPartido(a, b) {
  const pa = proximoPartidoDe(a.id), pb = proximoPartidoDe(b.id);
  if (pa && pb && pa.t !== pb.t) return pa.t - pb.t;
  if (pa && !pb) return -1;
  if (!pa && pb) return 1;
  return b.pctSecuenciales - a.pctSecuenciales || a.pais.localeCompare(b.pais);
}

function renderLista(listaLigas, plano) {
  const contenedor = document.getElementById("listaResumen");
  if (listaLigas.length === 0) {
    contenedor.innerHTML = '<div class="empty">No se encontraron ligas con ese filtro</div>';
    return;
  }

  // Buscando, los grupos estorban: se muestran los resultados planos.
  if (plano) {
    contenedor.innerHTML = listaLigas.map(filaLigaHTML).join("");
    return;
  }

  const enAlerta = listaLigas.filter(l => l.rango === 0).sort(porProximoPartido);

  let html = "";
  if (enAlerta.length) {
    html += `<div class="alerta-bloque">
      <div class="alerta-titulo"><span class="semaforo semaforo-rojo"></span>En alerta (${enAlerta.length})</div>
      ${enAlerta.map(l => filaLigaHTML(l, true)).join("")}
    </div>`;
  } else {
    html += '<div class="sin-alertas">Ninguna liga superó su umbral ahora mismo.</div>';
  }

  // Las que estan en alerta aparecen tambien dentro de su continente, no solo arriba.
  const porRegion = {};
  listaLigas.forEach(l => { (porRegion[l.region] = porRegion[l.region] || []).push(l); });

  const regiones = Object.keys(porRegion).sort((a, b) => {
    const ia = ORDEN_CONTINENTES.indexOf(a), ib = ORDEN_CONTINENTES.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  const abiertos = leerGruposAbiertos();
  regiones.forEach(region => {
    const ligasDelGrupo = porRegion[region];
    const conAlarma = ligasDelGrupo.filter(l => l.rango === 0).length;
    const cerrado = !abiertos.has(region); // plegado salvo que el usuario lo haya abierto
    html += `
      <div class="grupo ${cerrado ? "cerrado" : ""}" id="grupo-${slug(region)}" data-region="${escaparAtributo(region)}">
        <div class="grupo-header" onclick="alternarGrupo('${slug(region)}')">
          <span class="grupo-nombre">${region}</span>
          <span class="grupo-meta">${ligasDelGrupo.length}${conAlarma ? ` · ${conAlarma} con alarma` : ""}<span class="grupo-flecha">▾</span></span>
        </div>
        <div class="grupo-contenido">${ligasDelGrupo.map(l => filaLigaHTML(l)).join("")}</div>
      </div>
    `;
  });

  contenedor.innerHTML = html;
}

function etiquetaPorRacha(racha, umbral) {
  if (racha >= umbral) return "🔥 Racha de alerta activa";
  if (racha >= Math.ceil(umbral / 2)) return "¡Cerca de la alerta!";
  if (racha <= 1) return "Tranquilo";
  return "Atento";
}

function volverALista() {
  ligaActualId = null;
  document.getElementById("pageLista").classList.add("active");
  document.getElementById("pageDetalleLiga").classList.remove("active");
}

function mostrarDetalleLiga(ligaId) {
  ligaActualId = ligaId;
  const liga = ligas.find(l => l.id === ligaId);
  if (!liga) return;

  document.getElementById("pageLista").classList.remove("active");
  document.getElementById("pageDetalleLiga").classList.add("active");
  document.getElementById("detalleBandera").innerHTML = banderaDe(liga.pais, true);
  document.getElementById("detalleNombre").textContent = liga.nombre;
  document.getElementById("detallePais").textContent = liga.pais;

  const infoRacha = datosRacha.find(r => r.liga_id === ligaId);
  const infoAnalisis = datosAnalisis.find(r => r.liga_id === ligaId);

  // --- Card de racha vigente ---
  const racha = infoRacha ? parseInt(infoRacha.racha_actual || "0") : 0;
  const umbral = infoRacha ? parseInt(infoRacha.umbral_alerta || "5") : 5;
  const colorCard = racha >= umbral ? "card-red" : racha >= Math.ceil(umbral / 2) ? "card-yellow" : "card-green";

  // El cuadro muestra la rareza de la racha. Si la liga todavia no tiene fila en
  // 'Analisis 2' (recien agregada, la pestana se regenera una vez por dia) se cae
  // al cuadro viejo con el numero grande, que solo necesita 'Racha_Actual'.
  const infoExtremos = datosExtremos.find(r => r.liga_id === ligaId);
  const cardHTML = !infoRacha
    ? '<div class="card card-gray"><div class="racha-label" style="font-size:15px;">Sin datos de racha todavía</div></div>'
    : infoExtremos
      ? `<div class="card card-extremos ${colorCard}">${htmlRarezaRacha(infoExtremos, racha, umbral)}</div>`
      : `<div class="card ${colorCard}">
           <div class="racha-numero">${racha}</div>
           <div class="racha-label">partidos consecutivos sin empate (umbral: ${umbral})</div>
           <div class="racha-label" style="margin-top:6px; font-weight:600;">${etiquetaPorRacha(racha, umbral)}</div>
         </div>`;
  document.getElementById("detalleRachaCard").innerHTML = cardHTML;

  // --- Sub-pestaña Analisis ---
  if (infoAnalisis) {
    let filas = "";
    Object.keys(ETIQUETAS_ANALISIS).forEach(campo => {
      if (infoAnalisis[campo] === undefined) return;
      filas += `
        <div class="ficha-fila">
          <span class="ficha-etiqueta">${ETIQUETAS_ANALISIS[campo]}</span>
          <span class="ficha-valor">${infoAnalisis[campo]}${campo === "pct_secuenciales" ? "%" : ""}</span>
        </div>
      `;
    });
    document.getElementById("subpageAnalisis").innerHTML = `<div class="ficha-analisis">${filas}</div>`;
  } else {
    document.getElementById("subpageAnalisis").innerHTML = '<div class="empty">Sin datos de análisis para esta liga</div>';
  }

  // --- Sub-pestaña Partidos: se pide aparte, solo para esta liga ---
  renderPartidos(ligaId);

  // --- Sub-pestaña Extremos ---
  renderExtremos(ligaId, racha, umbral);

  // --- Sub-pestaña Próximos ---
  renderProximos(ligaId);

  cambiarSubpagina("extremos");
}

// La columna 'dias_para' del Sheet queda congelada en la corrida que genero la
// pestana, asi que al dia siguiente su "hoy" en realidad es ayer. Se recalcula
// aca contra el dia actual en hora Peru, que es la zona en la que el Sheet
// guarda las fechas.
function diasPara(fecha) {
  const f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(fecha || "").trim());
  if (!f) return NaN;
  const dia = Date.UTC(+f[1], +f[2] - 1, +f[3]);
  const enPeru = new Date(Date.now() - 5 * 3600 * 1000);
  const hoy = Date.UTC(enPeru.getUTCFullYear(), enPeru.getUTCMonth(), enPeru.getUTCDate());
  return Math.round((dia - hoy) / 86400000);
}

function textoCuando(fecha) {
  const n = diasPara(fecha);
  if (isNaN(n)) return "";
  if (n <= 0) return "hoy";
  if (n === 1) return "mañana";
  return `en ${n} días`;
}

function renderProximos(ligaId) {
  const contenedor = document.getElementById("subpageProximos");
  // Se descartan los que ya empezaron. La pestana del Sheet se regenera dos veces
  // por dia, asi que sin este filtro un partido de las 14:00 se seguia mostrando
  // como proximo a las 23:00. Mismo criterio que proximoPartidoDe(), para que el
  // semaforo y esta lista no se contradigan.
  const ahora = Date.now();
  const partidos = datosProximos
    .filter(p => {
      if (p.liga_id !== ligaId || !p.fecha) return false;
      const t = instanteDePartido(p.fecha, p.hora_peru);
      return t !== null && t >= ahora;
    })
    .sort((a, b) => (a.fecha + a.hora_peru).localeCompare(b.fecha + b.hora_peru));

  if (partidos.length === 0) {
    contenedor.innerHTML = '<div class="empty">No hay partidos programados con hora confirmada en los próximos días</div>';
    return;
  }

  let html = `<div class="section-title">${partidos.length} programados · próximos 14 días</div>`;
  let fechaPrevia = null;
  partidos.forEach(p => {
    if (p.fecha !== fechaPrevia) {
      html += `<div class="prox-dia">${p.fecha} <span class="prox-cuando">${textoCuando(p.fecha)}</span></div>`;
      fechaPrevia = p.fecha;
    }
    html += `
      <div class="partido">
        <div class="partido-fecha"><span>${p.hora_peru} (hora Perú)${p.ronda ? " · " + p.ronda : ""}</span></div>
        <div class="partido-marcador">
          <span class="equipo local">${p.equipo_local}</span>
          <span class="goles prox-vs">vs</span>
          <span class="equipo visitante">${p.equipo_visitante}</span>
        </div>
      </div>
    `;
  });
  contenedor.innerHTML = html;
}

// "Que tan rara es esta racha" ya no vive en la sub-pestana Extremos sino en el
// cuadro de color del detalle. Se devuelve como HTML en vez de escribirse a un
// contenedor para que mostrarDetalleLiga lo meta adentro del card.
function htmlRarezaRacha(info, rachaActual, umbral) {
  const doble = parseInt(info.doble_umbral || "0") || umbral * 2;
  const record = parseInt(info.racha_maxima || "0") || 0;

  // Un 8% de aire para que el punto final no quede pegado al borde.
  const tope = Math.max(record, doble, rachaActual, 1) * 1.08;
  const pos = v => Math.max(0, Math.min(100, (v / tope) * 100));

  // Cerca de los bordes la etiqueta se apoya contra el borde en vez de centrarse
  // sobre su marca: centrada se saldria del cuadro y quedaria cortada.
  const ubicar = p => p < 12
    ? `left:${p}%; align-items:flex-start;`
    : p > 88
      ? `right:${100 - p}%; align-items:flex-end;`
      : `left:${p}%; transform:translateX(-50%); align-items:center;`;

  // Referencias fijas de la liga. Se agrupan las que caen tan cerca que se
  // pisarian (pasa cuando el récord es igual al doble, o casi).
  const refs = [{ t: "Umbral", v: umbral }, { t: "Doble", v: doble }];
  if (record) refs.push({ t: "Récord", v: record });
  refs.sort((a, b) => a.v - b.v);

  const grupos = [];
  refs.forEach(m => {
    const ultimo = grupos[grupos.length - 1];
    if (ultimo && Math.abs(pos(m.v) - pos(ultimo[ultimo.length - 1].v)) < 11) ultimo.push(m);
    else grupos.push([m]);
  });

  const marcasArriba = grupos.map(g => {
    const p = pos(g[g.length - 1].v);
    const numeros = [...new Set(g.map(m => m.v))].join("/");
    return `<div class="marca" style="${ubicar(p)}">
        <span class="marca-txt">${g.map(m => m.t).join("/")}</span>
        <span class="marca-num">${numeros}</span>
      </div>`;
  }).join("");

  const ticks = refs.map(m => `<div class="escala-tick" style="left:${pos(m.v)}%"></div>`).join("");
  const pAhora = pos(rachaActual);

  let frase;
  if (rachaActual === 0) frase = "Sin racha activa: el último partido fue empate.";
  else if (record && rachaActual >= record) frase = `Está en su máximo histórico (${record}).`;
  else if (rachaActual >= doble) frase = `Ya superó el doble del umbral (${doble}).`;
  else if (rachaActual >= umbral) frase = `Cruzó el umbral, todavía no el doble (${doble}).`;
  else frase = `Por debajo del umbral (${umbral}).`;

  return `
    <div class="extremo-pregunta">¿Qué tan rara es esta racha?</div>
    <div class="escala-wrap">
      <div class="escala-marcas">${marcasArriba}</div>
      <div class="escala">
        <div class="escala-track"><div class="escala-relleno" style="width:${pAhora}%"></div></div>
        ${ticks}
        <div class="escala-ahora" style="left:${pAhora}%"></div>
      </div>
      <div class="escala-abajo">
        <div class="marca" style="${ubicar(pAhora)}">
          <span class="marca-num">${rachaActual}</span>
          <span class="marca-txt">Ahora</span>
        </div>
      </div>
    </div>
    <div class="escala-frase">${frase}</div>
  `;
}

// La sub-pestana queda solo con las rachas por temporada.
function renderExtremos(ligaId, rachaActual, umbral) {
  const contenedor = document.getElementById("subpageExtremos");
  const info = datosExtremos.find(r => r.liga_id === ligaId);
  if (!info) {
    contenedor.innerHTML = '<div class="empty">Sin datos de extremos para esta liga</div>';
    return;
  }

  const doble = parseInt(info.doble_umbral || "0") || umbral * 2;
  const anios = Object.keys(info).filter(k => /^\d{4}$/.test(k)).sort().reverse();
  let html = `<div class="section-title">Rachas de ${doble} o más, por temporada</div>`;

  anios.forEach(anio => {
    const d = parseCeldaExtremo(info[anio]);
    if (!d) return;
    const maximo = d.valores.length ? Math.max(...d.valores) : null;
    const chips = d.valores.length
      ? `<div class="extremo-chips">${d.valores
          .map(v => `<span class="chip ${v === maximo ? "chip-max" : ""}">${v}</span>`).join("")}</div>`
      : '<div class="extremo-vacio">Ninguna llegó al doble esta temporada</div>';

    html += `
      <div class="extremo-temp">
        <div class="extremo-temp-head">
          <span class="extremo-anio">${anio}</span>
          <span class="extremo-resumen">${d.cantidad} de ${d.empates} empates · ${d.pct}%</span>
        </div>
        ${chips}
      </div>
    `;
  });

  contenedor.innerHTML = html;
}

async function obtenerPartidosDeLiga(ligaId) {
  if (cachePartidos[ligaId]) return cachePartidos[ligaId];

  const id = Number(ligaId);
  if (!id) return { temporada: 0, partidos: [] };

  // 1) La temporada mas reciente de la liga. Pesa ~20 bytes.
  //    No se puede deducir de la fecha del ultimo partido: en las ligas europeas
  //    la temporada 2026 se juega entre agosto de 2026 y mayo de 2027.
  const rMax = await fetch(gvizUrl(GID_PARTIDOS, `select max(E) where B = ${id}`));
  const filasMax = parseCSV(await rMax.text());
  const temporada = filasMax.length ? parseInt(Object.values(filasMax[0])[0]) : 0;
  if (!temporada) {
    cachePartidos[ligaId] = { temporada: 0, partidos: [] };
    return cachePartidos[ligaId];
  }

  // 2) Solo los partidos de esa liga y esa temporada.
  const r = await fetch(gvizUrl(GID_PARTIDOS, `select * where B = ${id} and E = ${temporada}`));
  // Se filtra por fecha y no por fixture_id: esa columna tiene tipos mezclados en el
  // Sheet (numero desde cargar_historico, texto desde actualizar) y gviz devuelve
  // vacias las celdas que no coinciden con el tipo que infirio para la columna.
  const partidos = parseCSV(await r.text())
    .filter(p => p.fecha)
    .sort((a, b) => (b.fecha + b.hora_peru).localeCompare(a.fecha + a.hora_peru));

  cachePartidos[ligaId] = { temporada, partidos };
  return cachePartidos[ligaId];
}

async function renderPartidos(ligaId) {
  const contenedor = document.getElementById("subpagePartidos");
  contenedor.innerHTML = '<div class="loading">Cargando partidos...</div>';
  try {
    const { temporada, partidos } = await obtenerPartidosDeLiga(ligaId);
    if (ligaActualId !== ligaId) return; // el usuario ya se fue a otra liga

    let html = `<div class="section-title">Temporada ${temporada || "-"} (${partidos.length} partidos)</div>`;
    if (partidos.length === 0) {
      html += '<div class="empty">Aún no hay partidos registrados para esta liga</div>';
    } else {
      partidos.forEach(p => {
        const esEmpate = p.es_empate === "SI";
        html += `
        <div class="partido">
          <div class="partido-fecha">
            <span>${p.fecha} · ${p.hora_peru} (hora Perú)</span>
          </div>
          <div class="partido-marcador">
            <span class="equipo local">${p.equipo_local}</span>
            <span class="goles">${p.goles_local} - ${p.goles_visitante}</span>
            <span class="equipo visitante">${p.equipo_visitante}</span>
          </div>
          <div class="badge-fila">
            ${esEmpate ? '<span class="empate-badge">EMPATE</span>' : ""}
            <span class="modalidad-badge ${p.modalidad}">${p.modalidad}</span>
          </div>
        </div>
      `;
      });
    }
    contenedor.innerHTML = html;
  } catch (err) {
    console.error(err);
    if (ligaActualId === ligaId) {
      contenedor.innerHTML = '<div class="empty">Error al cargar los partidos. Probá de nuevo.</div>';
    }
  }
}

document.getElementById("buscadorLigas").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();

    ? ligas.filter(l => l.nombre.toLowerCase().includes(q) || l.pais.toLowerCase().includes(q))
    : ligas;
  renderLista(filtradas, Boolean(q));
});
