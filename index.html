<script>
const SHEET_ID = "1pw9zxaCFvKG3v5JlLbcIInJkuaYK2EiUIjwv8vkOFx8";
const csvUrl = (gid) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

const URL_ANALISIS  = csvUrl(17416755);
const URL_RACHA     = csvUrl(1219895524);
const URL_ESTADO    = csvUrl(874141647);
const URL_EXTREMOS  = csvUrl(615039692);   // hoja "Analisis 2", ~2 KB
const URL_PROXIMOS  = csvUrl(1027481726);  // hoja "Proximos", ~35 KB

// La hoja Partidos ya pesa mas de 1 MB y crece con cada liga, asi que no se baja
// entera: se piden solo los partidos de la liga que el usuario abre, filtrados del
// lado de Google con el lenguaje de consultas de gviz.
const GID_PARTIDOS = 0;
const gvizUrl = (gid, consulta) =>
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&tq=${encodeURIComponent(consulta)}`;

// Pastilla plana con el codigo del pais y el color dominante de su bandera.
// Reemplaza a los emoji de bandera: los dibuja el sistema operativo, salen
// "ondeados" y ocupan mas alto del que hace falta. Ademas varios Android no los
// traen y ya se veian como dos letras.
const PAISES = {
  "Inglaterra": ["EN", "#c8102e"], "España": ["ES", "#c60b1e"], "Alemania": ["DE", "#1a1a1a"],
  "Italia": ["IT", "#008c45"], "Francia": ["FR", "#0055a4"], "Países Bajos": ["NL", "#f36c21"],
  "Portugal": ["PT", "#006600"], "Bélgica": ["BE", "#fdda24"], "Turquía": ["TR", "#e30a17"],
  "Escocia": ["SC", "#005eb8"], "Grecia": ["GR", "#0d5eaf"], "Dinamarca": ["DK", "#c60c30"],
  "Noruega": ["NO", "#ba0c2f"], "Suecia": ["SE", "#006aa7"], "Suiza": ["CH", "#d52b1e"],
  "Rumania": ["RO", "#002b7f"], "Rusia": ["RU", "#0039a6"], "Austria": ["AT", "#ed2939"],
  "Polonia": ["PL", "#dc143c"], "Bielorrusia": ["BY", "#c8313e"], "Armenia": ["AM", "#d90012"],
  "Letonia": ["LV", "#9e3039"], "Lituania": ["LT", "#006a44"], "Estonia": ["EE", "#0072ce"],
  "Ucrania": ["UA", "#0057b7"], "Croacia": ["HR", "#e01e26"], "Serbia": ["RS", "#c6363c"],
  "Chequia": ["CZ", "#11457e"], "Eslovaquia": ["SK", "#0b4ea2"], "Hungría": ["HU", "#cd2a3e"],
  "Bulgaria": ["BG", "#00966e"], "Irlanda": ["IE", "#169b62"], "Islandia": ["IS", "#02529c"],
  "Finlandia": ["FI", "#002f6c"], "Chipre": ["CY", "#d57800"],
  "Perú": ["PE", "#d91023"], "Brasil": ["BR", "#009c3b"], "Argentina": ["AR", "#74acdf"],
  "México": ["MX", "#006847"], "Colombia": ["CO", "#fcd116"], "Chile": ["CL", "#0039a6"],
  "Ecuador": ["EC", "#ffdd00"], "Uruguay": ["UY", "#0038a8"], "Paraguay": ["PY", "#d52b1e"],
  "Venezuela": ["VE", "#00247d"], "Costa Rica": ["CR", "#ce1126"],
  "Estados Unidos": ["US", "#3c3b6e"], "Arabia Saudita": ["SA", "#006c35"],
  "Japón": ["JP", "#bc002d"], "Corea del Sur": ["KR", "#003478"],
  "Australia": ["AU", "#00247d"], "China": ["CN", "#de2910"],
};

// Sobre amarillos y celestes el texto blanco no se lee: se elige segun luminancia.
function textoSobre(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum > 0.6 ? "#1a1a1a" : "#ffffff";
}

function codigoDe(pais) {
  const p = PAISES[pais];
  return p ? p[0] : (pais || "??").slice(0, 2).toUpperCase();
}

function pastillaDe(pais, clase) {
  const p = PAISES[pais];
  const fondo = p ? p[1] : "#8a8f9a";
  return `<span class="pais-pill ${clase || ""}" style="background:${fondo};color:${textoSobre(fondo)}">${codigoDe(pais)}</span>`;
}

const ETIQUETAS_ANALISIS = {
  pais: "País",
  liga: "Liga",
  temporadas_analizadas: "Temporadas analizadas",
  total_partidos: "Total de partidos",
  total_empates: "Total de empates",
  promedio_racha: "Promedio de racha",
  desviacion_std: "Desviación estándar",
  umbral_alerta: "Umbral de alerta",
  racha_maxima: "Racha máxima histórica",
  partidos_secuenciales: "Partidos secuenciales",
  pct_secuenciales: "% secuenciales",
};

let datosAnalisis = [];
let datosRacha = [];
let datosExtremos = [];
let datosProximos = [];
let ligas = []; // [{id, nombre, pais}], derivado de Racha_Actual
let ligaActualId = null;
let cachePartidos = {}; // liga_id -> {temporada, partidos}, para no repedir al volver a entrar

function parseCSVLinea(linea) {
  const valores = [];
  let actual = "";
  let entreComillas = false;
  for (let i = 0; i < linea.length; i++) {
    const c = linea[i];
    if (c === '"') {
      if (entreComillas && linea[i + 1] === '"') {
        actual += '"';
        i++;
      } else {
        entreComillas = !entreComillas;
      }
    } else if (c === "," && !entreComillas) {
      valores.push(actual);
      actual = "";
    } else {
      actual += c;
    }
  }
  valores.push(actual);
  return valores.map(v => v.trim().replace(/\r/g, ""));
}

function parseCSV(texto) {
  const lineas = texto.trim().split("\n");
  const encabezados = parseCSVLinea(lineas[0]);
  return lineas.slice(1).map(linea => {
    const valores = parseCSVLinea(linea);
    const obj = {};
    encabezados.forEach((h, i) => obj[h] = valores[i]);
    return obj;
  });
}

function numeroDecimalComaOPunto(texto) {
  return parseFloat(String(texto).replace(",", "."));
}

function aplicarTema(tema) {
  document.documentElement.setAttribute("data-tema", tema);
  try { localStorage.setItem("tema", tema); } catch (e) { /* modo privado */ }
  // El icono muestra a donde se va, no donde se esta.
  document.getElementById("temaBtn").textContent = tema === "oscuro" ? "☀" : "☾";
}

function alternarTema() {
  const actual = document.documentElement.getAttribute("data-tema");
  aplicarTema(actual === "oscuro" ? "claro" : "oscuro");
}

// La hoja "Analisis 2" arranca con dos filas de titulo antes de los encabezados.
function parseCSVDesde(texto, filasAOmitir) {
  return parseCSV(texto.trim().split("\n").slice(filasAOmitir).join("\n"));
}

// Las celdas de temporada de "Analisis 2" vienen como texto legible, del estilo
// "6 de 81 (7,4%) -> 20, 13, 12". El formato lo genera analisis_extremos.py: si
// cambia alla, hay que cambiar esta expresion.
const RE_CELDA_EXTREMO = /^(\d+)\s+de\s+(\d+)\s+\(([\d.,]+)%\)(?:\s*->\s*(.*))?$/;

function parseCeldaExtremo(texto) {
  const m = RE_CELDA_EXTREMO.exec(String(texto || "").trim());
  if (!m) return null;
  return {
    cantidad: parseInt(m[1]),
    empates: parseInt(m[2]),
    pct: m[3],
    valores: m[4]
      ? m[4].split(",").map(v => parseInt(v.trim())).filter(n => !isNaN(n))
      : [],
  };
}

function cambiarSubpagina(sub) {
  ["Analisis", "Partidos", "Extremos", "Proximos"].forEach(nombre => {
    const activa = sub === nombre.toLowerCase();
    document.getElementById("subpage" + nombre).classList.toggle("active", activa);
    document.getElementById("subtabBtn" + nombre).classList.toggle("active", activa);
  });
}

async function cargarTodo() {
  document.getElementById("listaResumen").innerHTML = '<div class="loading">Cargando datos...</div>';
  try {
    const t = Date.now();
    cachePartidos = {}; // el boton de refrescar tiene que traer partidos frescos
    const [ra, rr, re, rx, rp] = await Promise.all([
      fetch(URL_ANALISIS + "&t=" + t),
      fetch(URL_RACHA + "&t=" + t),
      fetch(URL_ESTADO + "&t=" + t),
      fetch(URL_EXTREMOS + "&t=" + t),
      fetch(URL_PROXIMOS + "&t=" + t),
    ]);
    datosAnalisis = parseCSV(await ra.text());
    datosExtremos = parseCSVDesde(await rx.text(), 2);
    datosProximos = parseCSVDesde(await rp.text(), 1); // una fila de titulo
    datosRacha = parseCSV(await rr.text());
    const datosEstado = parseCSV(await re.text());

    // El orden tiene dos niveles. Primero el semaforo: lo que ya esta en alerta
    // arriba. Dentro de cada color manda el % de partidos en serie, porque en una
    // liga secuencial la racha es un dato limpio, mientras que en una que juega en
    // paralelo el orden entre partidos simultaneos es arbitrario y la racha puede
    // variar en +-1. Para encontrar una liga puntual esta el buscador.
    ligas = datosRacha
      .map(r => {
        const racha = parseInt(r.racha_actual || "0");
        const umbral = parseInt(r.umbral_alerta || "5") || 5;
        const analisis = datosAnalisis.find(a => a.liga_id === r.liga_id);
        const pctTexto = analisis ? analisis.pct_secuenciales : "";
        const pct = numeroDecimalComaOPunto(pctTexto);
        return {
          id: r.liga_id,
          nombre: r.liga,
          pais: r.pais,
          region: (r.region || "").trim() || "Otras",
          racha,
          umbral,
          pctTexto,
          pctSecuenciales: isNaN(pct) ? -1 : pct,
          rango: racha >= umbral ? 0 : racha >= Math.ceil(umbral / 2) ? 1 : 2,
          proximidad: racha / umbral, // >= 1 significa que ya cruzo el umbral
        };
      })
      .sort((a, b) =>
        a.rango - b.rango ||
        b.pctSecuenciales - a.pctSecuenciales ||
        b.proximidad - a.proximidad ||
        a.pais.localeCompare(b.pais)
      );

    const filaEjecucion = datosEstado.filter(r => r.clave === "ultima_ejecucion").pop();
    document.getElementById("ultimaEjecucion").textContent = filaEjecucion
      ? `Última actualización del sistema: ${filaEjecucion.valor} (hora Perú)`
      : "";

    renderLista(ligas);

    if (ligaActualId) mostrarDetalleLiga(ligaActualId);
  } catch (err) {
    document.getElementById("listaResumen").innerHTML = '<div class="empty">Error al cargar los datos. Intenta de nuevo.</div>';
    console.error(err);
  }
}

function colorSemaforo(racha, umbral) {
  if (racha === null) return "semaforo-gris";
  if (racha >= umbral) return "semaforo-rojo";
  if (racha >= Math.ceil(umbral / 2)) return "semaforo-amarillo";
  return "semaforo-verde";
}

// Los americanos primero: es de donde salio el proyecto y son las que mas se miran.
// Lo que no este en la lista se agrega al final por orden alfabetico.
const ORDEN_CONTINENTES = ["Sudamérica", "Norteamérica", "Europa", "Asia"];

function slug(texto) {
  return String(texto).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]/g, "");
}

function leerGruposCerrados() {
  try { return new Set(JSON.parse(localStorage.getItem("gruposCerrados") || "[]")); }
  catch (e) { return new Set(); }
}

function alternarGrupo(region) {
  const el = document.getElementById("grupo-" + slug(region));
  if (!el) return;
  const cerrado = el.classList.toggle("cerrado");
  const cerrados = leerGruposCerrados();
  if (cerrado) cerrados.add(region); else cerrados.delete(region);
  try { localStorage.setItem("gruposCerrados", JSON.stringify([...cerrados])); } catch (e) { /* modo privado */ }
}

function filaLigaHTML(liga) {
  const info = datosRacha.find(r => r.liga_id === liga.id);
  const racha = info ? parseInt(info.racha_actual || "0") : null;
  const umbral = info ? parseInt(info.umbral_alerta || "5") : 5;
  const rachaMaxima = info ? info.racha_maxima : "-";
  const color = colorSemaforo(racha, umbral);

  return `
    <div class="fila-liga" onclick="mostrarDetalleLiga('${liga.id}')">
      <div class="fila-liga-izq">
        ${pastillaDe(liga.pais)}
        <div>
          <div class="fila-liga-nombre">${liga.nombre}</div>
          <div class="fila-liga-pais">${liga.pais}${
            liga.pctTexto ? ` · <span class="fila-liga-serie">${liga.pctTexto}% en serie</span>` : ""
          }</div>
        </div>
      </div>
      <div class="fila-liga-derecha">
        ${racha === null
          ? '<span class="fila-liga-sindatos">Sin datos</span>'
          : `<span class="fila-liga-racha">${racha}/${umbral}/${rachaMaxima}</span>`
        }
        <span class="semaforo ${color}"></span>
        <span class="chevron">›</span>
      </div>
    </div>
  `;
}

function renderLista(listaLigas, plano) {
  const contenedor = document.getElementById("listaResumen");
  if (listaLigas.length === 0) {
    contenedor.innerHTML = '<div class="empty">No se encontraron ligas con ese filtro</div>';
    return;
  }

  // Buscando, los grupos estorban: se muestran los resultados planos.
  if (plano) {
    contenedor.innerHTML = listaLigas.map(filaLigaHTML).join("");
    return;
  }

  const enAlerta = listaLigas.filter(l => l.rango === 0);
  const resto = listaLigas.filter(l => l.rango !== 0);

  let html = "";
  if (enAlerta.length) {
    html += `<div class="alerta-bloque">
      <div class="alerta-titulo"><span class="semaforo semaforo-rojo"></span>En alerta (${enAlerta.length})</div>
      ${enAlerta.map(filaLigaHTML).join("")}
    </div>`;
  } else {
    html += '<div class="sin-alertas">Ninguna liga superó su umbral ahora mismo.</div>';
  }

  const porRegion = {};
  resto.forEach(l => { (porRegion[l.region] = porRegion[l.region] || []).push(l); });

  const regiones = Object.keys(porRegion).sort((a, b) => {
    const ia = ORDEN_CONTINENTES.indexOf(a), ib = ORDEN_CONTINENTES.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  const cerrados = leerGruposCerrados();
  regiones.forEach(region => {
    const ligasDelGrupo = porRegion[region];
    const alertasAca = enAlerta.filter(l => l.region === region).length;
    const cerrado = cerrados.has(region);
    html += `
      <div class="grupo ${cerrado ? "cerrado" : ""}" id="grupo-${slug(region)}">
        <div class="grupo-header" onclick="alternarGrupo(${JSON.stringify(region)})">
          <span class="grupo-nombre">${region}</span>
          <span class="grupo-meta">${ligasDelGrupo.length}${alertasAca ? ` · ${alertasAca} arriba` : ""}<span class="grupo-flecha">▾</span></span>
        </div>
        <div class="grupo-contenido">${ligasDelGrupo.map(filaLigaHTML).join("")}</div>
      </div>
    `;
  });

  contenedor.innerHTML = html;
}

function etiquetaPorRacha(racha, umbral) {
  if (racha >= umbral) return "🔥 Racha de alerta activa";
  if (racha >= Math.ceil(umbral / 2)) return "¡Cerca de la alerta!";
  if (racha <= 1) return "Tranquilo";
  return "Atento";
}

function volverALista() {
  ligaActualId = null;
  document.getElementById("pageLista").classList.add("active");
  document.getElementById("pageDetalleLiga").classList.remove("active");
}

function mostrarDetalleLiga(ligaId) {
  ligaActualId = ligaId;
  const liga = ligas.find(l => l.id === ligaId);
  if (!liga) return;

  document.getElementById("pageLista").classList.remove("active");
  document.getElementById("pageDetalleLiga").classList.add("active");
  document.getElementById("detalleBandera").innerHTML = pastillaDe(liga.pais, "pais-pill-grande");
  document.getElementById("detalleNombre").textContent = liga.nombre;
  document.getElementById("detallePais").textContent = liga.pais;

  const infoRacha = datosRacha.find(r => r.liga_id === ligaId);
  const infoAnalisis = datosAnalisis.find(r => r.liga_id === ligaId);

  // --- Card de racha vigente ---
  const racha = infoRacha ? parseInt(infoRacha.racha_actual || "0") : 0;
  const umbral = infoRacha ? parseInt(infoRacha.umbral_alerta || "5") : 5;
  const ultimaActualizacion = infoRacha ? infoRacha.ultima_actualizacion : "";
  const colorCard = racha >= umbral ? "card-red" : racha >= Math.ceil(umbral / 2) ? "card-yellow" : "card-green";

  document.getElementById("detalleRachaCard").innerHTML = infoRacha ? `
    <div class="card ${colorCard}">
      <div class="racha-numero">${racha}</div>
      <div class="racha-label">partidos consecutivos sin empate (umbral: ${umbral})</div>
      <div class="racha-label" style="margin-top:6px; font-weight:600;">${etiquetaPorRacha(racha, umbral)}</div>
      ${ultimaActualizacion ? `<div class="racha-fecha">Actualizado: ${ultimaActualizacion}</div>` : ""}
    </div>
  ` : `<div class="card card-gray"><div class="racha-label" style="font-size:15px;">Sin datos de racha todavía</div></div>`;

  // --- Sub-pestaña Analisis ---
  if (infoAnalisis) {
    let filas = "";
    Object.keys(ETIQUETAS_ANALISIS).forEach(campo => {
      if (infoAnalisis[campo] === undefined) return;
      filas += `
        <div class="ficha-fila">
          <span class="ficha-etiqueta">${ETIQUETAS_ANALISIS[campo]}</span>
          <span class="ficha-valor">${infoAnalisis[campo]}${campo === "pct_secuenciales" ? "%" : ""}</span>
        </div>
      `;
    });
    document.getElementById("subpageAnalisis").innerHTML = `<div class="ficha-analisis">${filas}</div>`;
  } else {
    document.getElementById("subpageAnalisis").innerHTML = '<div class="empty">Sin datos de análisis para esta liga</div>';
  }

  // --- Sub-pestaña Partidos: se pide aparte, solo para esta liga ---
  renderPartidos(ligaId);

  // --- Sub-pestaña Extremos ---
  renderExtremos(ligaId, racha, umbral);

  // --- Sub-pestaña Próximos ---
  renderProximos(ligaId);

  cambiarSubpagina("analisis");
}

function textoCuando(dias) {
  const n = parseInt(dias);
  if (isNaN(n)) return "";
  if (n === 0) return "hoy";
  if (n === 1) return "mañana";
  return `en ${n} días`;
}

function renderProximos(ligaId) {
  const contenedor = document.getElementById("subpageProximos");
  const partidos = datosProximos
    .filter(p => p.liga_id === ligaId && p.fecha)
    .sort((a, b) => (a.fecha + a.hora_peru).localeCompare(b.fecha + b.hora_peru));

  if (partidos.length === 0) {
    contenedor.innerHTML = '<div class="empty">No hay partidos programados con hora confirmada en los próximos días</div>';
    return;
  }

  let html = `<div class="section-title">${partidos.length} programados · próximos 14 días</div>`;
  let fechaPrevia = null;
  partidos.forEach(p => {
    if (p.fecha !== fechaPrevia) {
      html += `<div class="prox-dia">${p.fecha} <span class="prox-cuando">${textoCuando(p.dias_para)}</span></div>`;
      fechaPrevia = p.fecha;
    }
    html += `
      <div class="partido">
        <div class="partido-fecha"><span>${p.hora_peru} (hora Perú)${p.ronda ? " · " + p.ronda : ""}</span></div>
        <div class="partido-marcador">
          <span class="equipo local">${p.equipo_local}</span>
          <span class="goles prox-vs">vs</span>
          <span class="equipo visitante">${p.equipo_visitante}</span>
        </div>
      </div>
    `;
  });
  contenedor.innerHTML = html;
}

function renderExtremos(ligaId, rachaActual, umbral) {
  const contenedor = document.getElementById("subpageExtremos");
  const info = datosExtremos.find(r => r.liga_id === ligaId);
  if (!info) {
    contenedor.innerHTML = '<div class="empty">Sin datos de extremos para esta liga</div>';
    return;
  }

  const doble = parseInt(info.doble_umbral || "0") || umbral * 2;
  const record = parseInt(info.racha_maxima || "0") || 0;

  // Un 8% de aire para que el punto final no quede pegado al borde.
  const tope = Math.max(record, doble, rachaActual, 1) * 1.08;
  const pos = v => Math.max(0, Math.min(100, (v / tope) * 100));
  const color = rachaActual >= umbral ? "rojo"
    : rachaActual >= Math.ceil(umbral / 2) ? "amarillo" : "verde";

  let frase;
  if (rachaActual === 0) frase = "Sin racha activa: el último partido fue empate.";
  else if (record && rachaActual >= record) frase = `Está en su máximo histórico (${record}).`;
  else if (rachaActual >= doble) frase = `Ya superó el doble del umbral (${doble}).`;
  else if (rachaActual >= umbral) frase = `Cruzó el umbral, todavía no el doble (${doble}).`;
  else frase = `Por debajo del umbral (${umbral}).`;

  let html = `
    <div class="extremo-pregunta">¿Qué tan rara es esta racha?</div>
    <div class="escala">
      <div class="escala-track"><div class="escala-relleno ${color}" style="width:${pos(rachaActual)}%"></div></div>
      <div class="escala-tick" style="left:${pos(umbral)}%"></div>
      <div class="escala-tick" style="left:${pos(doble)}%"></div>
    </div>
    <div class="escala-leyenda">
      <span>Ahora <b>${rachaActual}</b></span>
      <span>Umbral <b>${umbral}</b></span>
      <span>Doble <b>${doble}</b></span>
      <span>Récord <b>${record || "-"}</b></span>
    </div>
    <div class="escala-frase">${frase}</div>
  `;

  const anios = Object.keys(info).filter(k => /^\d{4}$/.test(k)).sort().reverse();
  html += `<div class="section-title">Rachas de ${doble} o más, por temporada</div>`;

  anios.forEach(anio => {
    const d = parseCeldaExtremo(info[anio]);
    if (!d) return;
    const maximo = d.valores.length ? Math.max(...d.valores) : null;
    const chips = d.valores.length
      ? `<div class="extremo-chips">${d.valores
          .map(v => `<span class="chip ${v === maximo ? "chip-max" : ""}">${v}</span>`).join("")}</div>`
      : '<div class="extremo-vacio">Ninguna llegó al doble esta temporada</div>';

    html += `
      <div class="extremo-temp">
        <div class="extremo-temp-head">
          <span class="extremo-anio">${anio}</span>
          <span class="extremo-resumen">${d.cantidad} de ${d.empates} empates · ${d.pct}%</span>
        </div>
        ${chips}
      </div>
    `;
  });

  contenedor.innerHTML = html;
}

async function obtenerPartidosDeLiga(ligaId) {
  if (cachePartidos[ligaId]) return cachePartidos[ligaId];

  const id = Number(ligaId);
  if (!id) return { temporada: 0, partidos: [] };

  // 1) La temporada mas reciente de la liga. Pesa ~20 bytes.
  //    No se puede deducir de la fecha del ultimo partido: en las ligas europeas
  //    la temporada 2026 se juega entre agosto de 2026 y mayo de 2027.
  const rMax = await fetch(gvizUrl(GID_PARTIDOS, `select max(E) where B = ${id}`));
  const filasMax = parseCSV(await rMax.text());
  const temporada = filasMax.length ? parseInt(Object.values(filasMax[0])[0]) : 0;
  if (!temporada) {
    cachePartidos[ligaId] = { temporada: 0, partidos: [] };
    return cachePartidos[ligaId];
  }

  // 2) Solo los partidos de esa liga y esa temporada.
  const r = await fetch(gvizUrl(GID_PARTIDOS, `select * where B = ${id} and E = ${temporada}`));
  // Se filtra por fecha y no por fixture_id: esa columna tiene tipos mezclados en el
  // Sheet (numero desde cargar_historico, texto desde actualizar) y gviz devuelve
  // vacias las celdas que no coinciden con el tipo que infirio para la columna.
  const partidos = parseCSV(await r.text())
    .filter(p => p.fecha)
    .sort((a, b) => (b.fecha + b.hora_peru).localeCompare(a.fecha + a.hora_peru));

  cachePartidos[ligaId] = { temporada, partidos };
  return cachePartidos[ligaId];
}

async function renderPartidos(ligaId) {
  const contenedor = document.getElementById("subpagePartidos");
  contenedor.innerHTML = '<div class="loading">Cargando partidos...</div>';
  try {
    const { temporada, partidos } = await obtenerPartidosDeLiga(ligaId);
    if (ligaActualId !== ligaId) return; // el usuario ya se fue a otra liga

    let html = `<div class="section-title">Temporada ${temporada || "-"} (${partidos.length} partidos)</div>`;
    if (partidos.length === 0) {
      html += '<div class="empty">Aún no hay partidos registrados para esta liga</div>';
    } else {
      partidos.forEach(p => {
        const esEmpate = p.es_empate === "SI";
        html += `
        <div class="partido">
          <div class="partido-fecha">
            <span>${p.fecha} · ${p.hora_peru} (hora Perú)</span>
          </div>
          <div class="partido-marcador">
            <span class="equipo local">${p.equipo_local}</span>
            <span class="goles">${p.goles_local} - ${p.goles_visitante}</span>
            <span class="equipo visitante">${p.equipo_visitante}</span>
          </div>
          <div class="badge-fila">
            ${esEmpate ? '<span class="empate-badge">EMPATE</span>' : ""}
            <span class="modalidad-badge ${p.modalidad}">${p.modalidad}</span>
          </div>
        </div>
      `;
      });
    }
    contenedor.innerHTML = html;
  } catch (err) {
    console.error(err);
    if (ligaActualId === ligaId) {
      contenedor.innerHTML = '<div class="empty">Error al cargar los partidos. Probá de nuevo.</div>';
    }
  }
}

document.getElementById("buscadorLigas").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtradas = q
    ? ligas.filter(l => l.nombre.toLowerCase().includes(q) || l.pais.toLowerCase().includes(q))
    : ligas;
  renderLista(filtradas, Boolean(q));
});

aplicarTema(document.documentElement.getAttribute("data-tema") || "claro");
cargarTodo();
</script>
